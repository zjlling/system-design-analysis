<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云齿通 CloudDent · 业务工作台</title>
  <style>
/* ============================================================
 * 云齿通 CloudDent —— 全局样式
 * 主题：医疗青绿 · 干净专业
 * ============================================================ */
:root {
  --primary: #0f766e;
  --primary-2: #0d9488;
  --primary-3: #14b8a6;
  --sidebar-bg: #0c3a3e;
  --sidebar-bg2: #0a2f33;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --danger: #dc2626;
  --warn: #d97706;
  --ok: #16a34a;
  --info: #0ea5e9;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; }

/* ---------- Toast ---------- */
#toast-box { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: none; }
.toast {
  background: #0f172a; color: #fff; padding: 10px 22px; border-radius: 999px;
  font-size: 13px; box-shadow: 0 6px 24px rgba(15, 23, 42, .25); white-space: nowrap;
}
.toast.warn { background: #b45309; }
.toast.info { background: #0e7490; }

/* ---------- 登录页 ---------- */
#login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0b3a3e 0%, #0f766e 55%, #14b8a6 120%);
  padding: 24px;
}
.login-card {
  width: 420px; max-width: 100%; background: #fff; border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .28); overflow: hidden;
}
.login-brand {
  background: linear-gradient(135deg, #0b3a3e, #0f766e);
  color: #fff; padding: 34px 36px 26px;
}
.login-brand .logo-row { display: flex; align-items: center; gap: 12px; }
.login-brand .logo-badge {
  width: 46px; height: 46px; border-radius: 12px; background: rgba(255, 255, 255, .14);
  display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
}
.login-brand h1 { font-size: 22px; letter-spacing: 1px; }
.login-brand p { font-size: 12px; opacity: .75; margin-top: 2px; }
.login-body { padding: 28px 36px 34px; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.login-field input {
  width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  transition: border .15s;
}
.login-field input:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(13, 148, 136, .12); }
.login-btn {
  width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px;
  font-size: 15px; letter-spacing: 2px; transition: background .15s;
}
.login-btn:hover { background: var(--primary-2); }
.quick-row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.quick-account {
  border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px;
  font-size: 12px; color: var(--muted); transition: all .15s;
}
.quick-account:hover { border-color: var(--primary-2); color: var(--primary); background: #f0fdfa; }
.login-tip { margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center; }

/* ---------- 整体布局 ---------- */
#app-shell { display: none; min-height: 100vh; }
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 216px; z-index: 50;
  background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg2));
  color: #cbd5e1; display: flex; flex-direction: column;
}
.side-logo { padding: 18px 18px 16px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.side-logo .logo-row { display: flex; align-items: center; gap: 10px; color: #fff; }
.side-logo .logo-badge {
  width: 36px; height: 36px; border-radius: 9px; background: rgba(255, 255, 255, .13);
  display: flex; align-items: center; justify-content: center; font-size: 19px;
}
.side-logo h1 { font-size: 16px; letter-spacing: .5px; }
.side-logo p { font-size: 11px; opacity: .65; }
#nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  color: #cbd5e1; font-size: 13.5px; margin-bottom: 3px; transition: background .15s, color .15s;
}
.nav-item:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-item.active { background: var(--primary-2); color: #fff; font-weight: 600; }
/* 侧栏分组标题：可点击展开 / 收起 */
.nav-group {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; box-sizing: border-box; margin: 0; padding: 12px 12px 6px;
  background: none; border: 0; cursor: pointer; text-align: left;
  font-family: inherit; font-size: 11px; letter-spacing: .08em;
  color: rgba(203, 213, 225, .55); user-select: none; transition: color .15s;
}
.nav-group:first-child { padding-top: 2px; }
.nav-group:hover { color: #e2e8f0; }
.nav-group .chev {
  width: 0; height: 0; margin-right: 3px; flex: none;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid currentColor; transition: transform .18s;
}
.nav-group.folded .chev { transform: rotate(-90deg); }
.nav-box[hidden] { display: none; }
.side-foot { padding: 14px 18px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 11px; color: #7c9a9e; }

.main { margin-left: 216px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  height: 58px; background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
  position: sticky; top: 0; z-index: 40;
}
.topbar .crumb { font-size: 13px; color: var(--muted); }
.topbar .user-box { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
}
.user-box .u-name { font-size: 13.5px; font-weight: 600; }
.user-box .u-role { font-size: 11px; color: var(--muted); }
.btn-logout {
  border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 7px;
  padding: 5px 12px; font-size: 12px; transition: all .15s;
}
.btn-logout:hover { color: var(--danger); border-color: #fecaca; }

#view { padding: 24px 26px 40px; max-width: 1400px; width: 100%; margin: 0 auto; }

/* ---------- 页面头 ---------- */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.page-head h2 { font-size: 20px; font-weight: 700; }
.page-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 20px; margin-bottom: 18px;
}
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.grid-2 .card { margin-bottom: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 18px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; display: flex; align-items: center; gap: 14px;
}
.stat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.stat-label { font-size: 12.5px; color: var(--muted); }
.stat-value { font-size: 21px; font-weight: 700; margin-top: 2px; }

/* ---------- 表格 ---------- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
  padding: 9px 10px; border-bottom: 1px solid var(--line); background: #f8fafc; white-space: nowrap;
}
.tbl td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; vertical-align: middle; }
.tbl tbody tr:hover { background: #f8fafc; }
.tbl .empty { text-align: center; color: #94a3b8; padding: 26px 0; }
.tbl td.op { white-space: nowrap; }
.muted { color: var(--muted); }
.muted.sm { font-size: 11px; }

/* ---------- 按钮 ---------- */
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 7px;
  padding: 7px 14px; font-size: 13px; transition: all .15s;
}
.btn:hover { border-color: var(--primary-2); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-2); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; margin-right: 6px; }
.btn-plain { border-color: transparent; background: transparent; color: var(--muted); }
.btn-plain:hover { color: var(--primary); border-color: transparent; background: #f0fdfa; }
.btn-danger-plain { border-color: transparent; background: transparent; color: var(--danger); }
.btn-danger-plain:hover { background: #fef2f2; }

/* ---------- 表单 ---------- */
.inp {
  width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; outline: none;
  transition: border .15s; background: #fff;
}
.inp:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(13, 148, 136, .10); }
textarea.inp { resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form-item label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.form-item:has(textarea) { grid-column: 1 / -1; }
.form-item:has(input[type="date"]) { }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar .inp { width: 260px; }
.mb { margin-bottom: 12px; }
.mt { margin-top: 14px; }

/* ---------- 筛选 chip ---------- */
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 12.5px;
  color: var(--muted); background: #fff; transition: all .15s;
}
.chip:hover { border-color: var(--primary-2); color: var(--primary); }
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- 标签 ---------- */
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.tag-ok { background: #dcfce7; color: #15803d; }
.tag-warn { background: #fef3c7; color: #b45309; }
.tag-bad { background: #fee2e2; color: #b91c1c; }
.tag-info { background: #e0f2fe; color: #0369a1; }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto;
}
.modal-box {
  background: #fff; border-radius: 14px; width: 620px; max-width: 100%;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .25); animation: pop .18s ease-out;
}
.modal-box.wide { width: 780px; }
@keyframes pop { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px; border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 16px; }
.modal-x { border: none; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
.modal-x:hover { color: var(--text); }
.modal-body { padding: 20px 22px; max-height: 68vh; overflow-y: auto; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

/* ---------- 患者详情 ---------- */
.patient-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.patient-head .avatar { width: 46px; height: 46px; font-size: 19px; border-radius: 50%; }
.pt-tags { margin-left: auto; }
.kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 8px; }
.kv-grid > div { background: #f8fafc; border-radius: 8px; padding: 10px 12px; }
.kv-grid i { display: block; font-style: normal; font-size: 11px; color: var(--muted); }
.kv-grid b { font-size: 13px; font-weight: 600; }
.sub-title { font-size: 13px; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
.rec-text { background: #f8fafc; border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* ---------- 收费 ---------- */
.bill-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.pay-sum { text-align: right; margin-top: 14px; font-size: 14px; color: var(--muted); }
.pay-sum b { color: var(--danger); font-size: 20px; }

/* ---------- 病历 ---------- */
.rx-block { margin-top: 14px; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 14px; }
.rx-head { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.rx-add { display: flex; gap: 10px; margin-bottom: 10px; }
.rx-tbl th, .rx-tbl td { padding: 7px 8px; }
.rx-total { text-align: right; margin-top: 8px; font-size: 13px; color: var(--muted); }
.rx-total b { font-size: 16px; color: var(--text); }

/* ---------- 排班 ---------- */
.sched-tbl th { text-align: center; }
.sched-tbl td { text-align: center; }
.st-emp { text-align: left !important; white-space: nowrap; }
.st-emp b { display: block; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; margin: 1px 2px; }
.dot.on { background: var(--primary-2); }
.legend-line { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.note { margin-top: 10px; }

/* ---------- 库存 ---------- */
.stock-low { color: var(--danger); font-weight: 700; }
.stock-low::after { content: " 预警"; font-size: 11px; color: var(--danger); }

/* ---------- 图表 ---------- */
.donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut-legend-list { flex: 1; min-width: 180px; }
.donut-legend { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }
.donut-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.donut-legend span { color: var(--muted); flex: 1; }
.donut-legend b { font-weight: 600; }
.donut-legend em { font-style: normal; color: #94a3b8; font-size: 11px; width: 42px; text-align: right; }

/* ---------- 响应式 ---------- */
@media (max-width: 1080px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  /* 目录始终固定在左侧侧边栏；窄窗口不做专门适配 */
  #view { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .toolbar .inp { width: 100%; }
  .tbl { display: block; overflow-x: auto; }
}


/* 业务工作台登录页：业务人员下拉 */
.login-field select {
  width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px;
  outline: none; background: #fff; color: #334155; font-size: 14px;
}
.login-field select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(13, 148, 136, .12); }

  /* 绩效工资条：月份切换与合计行 */
  .perf-tabs{display:flex;gap:8px;margin:4px 0 16px}
  .perf-tab{padding:7px 18px;border:1px solid #cbd5e1;background:#fff;color:#475569;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s}
  .perf-tab:hover{border-color:#0f766e;color:#0f766e}
  .perf-tab.active{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700}
  .tbl tr.sum-row{background:#f8fafc}
  .tbl tr.net-row{background:#e6f5f3}
  .tbl tr.net-row td{color:#0f766e;font-size:15px}
  .muted{color:#64748b;font-size:12px}
</style>

      background: #fff; color: #334155; font-size: 12.5px; outline: none; }

    #btn-reset { display: none; }

  /* ---------- 渲染与绑定 ---------- */
  function route() { return (location.hash.replace(/^#\/?/, '') || 'dashboard').split('?')[0]; }

  function renderShell() {
    var logged = !!currentUser;
    $('#login-wrap').style.display = logged ? 'none' : 'flex';
    $('#app-shell').style.display = logged ? 'block' : 'none';
    if (!logged) return;
    $('#user-name').textContent = currentUser.name;
    $('#user-role').textContent = currentUser.label + ' · ' + shop(currentUser.shopId);
    $('#user-avatar').textContent = currentUser.name.charAt(0);
    $('#crumb').textContent = '方寸口腔连锁门诊 · ' + shop(currentShop === 'ALL' ? currentUser.shopId : currentShop) + ' · ' + currentUser.label;
    var nav = D.NAV.filter(function (n) { return n.roles.indexOf(currentUser.role) >= 0; });
    /* 侧栏：按业务域分组，组标题可点开/收起 */
    var order = [], buckets = {};
    nav.forEach(function (n) {
      var g = n.group || '';
      if (!buckets[g]) { buckets[g] = []; order.push(g); }
      buckets[g].push(n);
    });
    var navHtml = '';
    order.forEach(function (g) {
      var folded = !!(g && navFolded[g]);
      if (g) {
        navHtml += '<button type="button" class="nav-group' + (folded ? ' folded' : '') + '" data-group="' + esc(g) + '" title="展开/收起">' +
                   '<span>' + esc(g) + '</span><i class="chev"></i></button>';
      }
      navHtml += '<div class="nav-box"' + (g ? ' data-box="' + esc(g) + '"' : '') + (folded ? ' hidden' : '') + '>' +
        buckets[g].map(function (n) {
          return '<a class="nav-item" href="#/' + n.path + '"><span>' + esc(n.label) + '</span></a>';
        }).join('') + '</div>';
    });
    $('#nav').innerHTML = navHtml;
    $$('#nav .nav-group').forEach(function (b) {
      b.addEventListener('click', function () {
        var g = b.getAttribute('data-group');
        navFolded[g] = !navFolded[g];
        b.classList.toggle('folded', !!navFolded[g]);
        var box = b.nextElementSibling;
        if (box) {
          if (navFolded[g]) box.setAttribute('hidden', '');
          else box.removeAttribute('hidden');
        }
        try { localStorage.setItem(NAV_FOLD_KEY, JSON.stringify(navFolded)); } catch (e) {}
      });
    });
    var roleSel = $('#staff-role');
    if (roleSel) roleSel.value = staffKey;
    var roleChip = $('#role-chip');
    if (roleChip) roleChip.textContent = currentUser.label;
    var shopSel = $('#shop-filter');
    if (currentUser.role === 'all' || currentUser.role === 'hq') {
      shopSel.style.display = '';
      shopSel.innerHTML = '<option value="ALL">全部门店</option>' +
        D.SHOPS.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('');
      shopSel.value = currentShop;
    } else {
      currentShop = currentUser.shopId;
      shopSel.style.display = '';
      shopSel.innerHTML = '<option value="' + currentUser.shopId + '">' + esc(shop(currentUser.shopId)) + '</option>';
      shopSel.value = currentUser.shopId;
    }
    render();
  }

  function render() {
    if (!currentUser) return;
    var r = route(), view = $('#view');
    $$('.nav-item').forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === '#/' + r); });
    if (!can(r) && r !== 'dashboard') {
      D.log('越权访问拦截', '尝试访问 #/' + r, currentUser);
      view.innerHTML = pageHead('无权限', '访问已被系统拦截') +
        card('访问受限', '<p class="muted">当前工作视图「' + esc(currentUser.label) + '」没有该功能的访问权限。本次尝试已写入访问日志。</p>');
      return;
    }
    var nav = D.NAV.find(function (n) { return n.path === r; });
    D.log('访问模块', nav ? nav.label : '工作台', currentUser);
    view.innerHTML = (V[r] || V.dashboard)();
  }

  function bind() {
    $('#btn-login').addEventListener('click', function () {
      if (doLogin(val('login-role'), val('login-user'), document.getElementById('login-pass').value)) {
        location.hash = '#/dashboard'; renderShell();
      }
    });
    $('#login-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#btn-login').click(); });
    $('#login-user').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#btn-login').click(); });
    $('#btn-logout').addEventListener('click', doLogout);
    if ($('#staff-role')) {
      $('#staff-role').addEventListener('change', function (e) {
        setStaff(e.target.value);
        currentShop = 'ALL';
        location.hash = '#/dashboard';
        renderShell();
      });
    }
    $('#shop-filter').addEventListener('change', function (e) { currentShop = e.target.value; renderShell(); });
    $('#view').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var fn = ACT[b.dataset.act];
      if (fn) fn(b.dataset.id);
    });
    window.addEventListener('hashchange', function () { if (currentUser) render(); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    D.load();
    restoreSession();
    bind();
    renderShell();
  });
})();

</script>
