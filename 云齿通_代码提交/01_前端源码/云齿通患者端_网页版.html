<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#e8edf2;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5}
#phone{max-width:430px;margin:0 auto;min-height:100vh;background:#f5f7fa;box-shadow:0 0 30px rgba(15,118,110,.12);position:relative;padding-bottom:64px}
.page{min-height:100vh;padding:12px 12px 30px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px rgba(15,118,110,.06)}

.muted,.small{color:#6b7280;font-size:12px}
.green{color:#0f766e}.orange{color:#d97706}.red{color:#dc2626}
.row{display:flex;align-items:center}.between{justify-content:space-between}
.divider{height:1px;background:#eef2f5;margin:10px 0}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#ccfbf1;color:#0f766e;font-size:11px;white-space:nowrap}
.tag-warn{background:#fef3c7;color:#b45309}.tag-gray{background:#f1f5f9;color:#64748b}
.btn{display:block;width:100%;border:none;border-radius:7px;padding:11px 0;text-align:center;font-size:14px;cursor:pointer;line-height:1.4}
.btn-primary{background:#0f766e;color:#fff}.btn-ghost{background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}
.btn-sm{display:inline-block;width:auto;padding:5px 13px;font-size:12px;margin:6px 6px 0 0}
.grid{display:flex;flex-wrap:wrap}.grid-4>div{width:25%;box-sizing:border-box}
.entry{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;cursor:pointer}
.entry-icon{width:42px;height:42px;border-radius:12px;background:#f0fdfa;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0f766e;font-weight:700;margin-bottom:6px}
.entry-text{font-size:12px;color:#374151}
.stat-num{font-size:22px;font-weight:700;color:#0f766e;display:block}.stat-label{font-size:11px;color:#6b7280}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef2f5}
.list-item:last-child{border-bottom:none}
.item-title{font-size:14px;font-weight:600;display:block}.item-sub{font-size:12px;color:#6b7280;display:block;margin-top:4px}
.input,.picker,.textarea{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:9px 11px;font-size:14px;width:100%;color:#334155;font-family:inherit}
.input{height:40px}.textarea{height:80px;resize:vertical}
.field-label{font-size:13px;color:#374151;display:block;margin:11px 0 6px}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);border-radius:12px;padding:22px 18px;color:#fff;margin-bottom:12px}
.hero-title{font-size:22px;font-weight:700;display:block}.hero-sub{font-size:12px;opacity:.9;display:block;margin-top:6px}
.empty{text-align:center;color:#94a3b8;font-size:13px;padding:25px 0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;gap:10px}.kv-label{color:#6b7280;flex:none}.kv span:last-child{text-align:right}
.login-page{min-height:100vh;background:linear-gradient(160deg,#0b3a3e,#0f766e 60%,#14b8a6);display:flex;flex-direction:column;justify-content:center;padding:0 32px}
.login-brand{text-align:center;margin-bottom:36px}.login-logo{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.18);color:#fff;font-size:27px;font-weight:700;line-height:58px;margin:0 auto 14px}
.login-title{display:block;color:#fff;font-size:21px;font-weight:700;letter-spacing:1px}.login-sub{display:block;color:rgba(255,255,255,.78);font-size:12px;margin-top:6px}
.login-box{background:#fff;border-radius:12px;padding:28px 20px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.login-box .input{margin-bottom:15px}
.login-btn{margin-top:8px;height:44px;font-size:16px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:58px;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:20;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.tabbar div{flex:1;text-align:center;font-size:11px;color:#6b7280;padding-top:9px;cursor:pointer}
.tabbar div.on{color:#0f766e;font-weight:700}.tabbar .ti{font-size:18px;display:block;line-height:1.2}
#toast{position:fixed;top:40%;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:99}
#cloudbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#0f766e;color:#fff;font-size:11px;text-align:center;padding:4px;z-index:30;opacity:.92}
.hasbar{padding-top:22px}
</style>
</head>

};

var CHAIR={DC001:'1 号牙椅',DC002:'2 号牙椅',DC003:'3 号牙椅',DC004:'4 号牙椅',DC005:'5 号牙椅',DC006:'6 号牙椅',DC007:'7 号牙椅'};
var CLOUD=null,S={},PAGE='login',FORM={};
function shopName(id){var x=SEED.shops.filter(function(v){return v.id===id;})[0];return x?x.name:(id||'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},1800);}
function merge(k,pid){
 var a=(SEED[k]||[]).filter(function(x){return !pid||x.patientId===pid;});
 var b=((CLOUD||{})[k]||[]).filter(function(x){return !pid||x.patientId===pid;});
 var map={};a.forEach(function(x){map[x.id]=x;});
 b.forEach(function(x){map[x.id]=Object.assign({},map[x.id]||{},x);});
 var out=[];for(var id in map)out.push(map[id]);return out;
}
function normAppt(x){return Object.assign({},x,{doctor:x.doctor||DOC[x.doctorId]||'',chair:CHAIR[x.chair]||x.chair||'待分配',time:(x.time||'').replace(/^\d{4}-\d{2}-\d{2}\s*/,'')});}
function normBill(x){return Object.assign({},x,{method:x.method||x.payMethod||'',status:x.status==='已收款'?'已支付':x.status});}
function mine(k){var pid=S.patientId||'';
 if(k==='appointments')return merge(k,pid).map(normAppt);
 if(k==='bills')return merge(k,pid).map(normBill);
 return merge(k,pid);
}
function loadCloud(cb){
 var done=function(ok){document.getElementById('cloudbar').textContent=ok?'云端数据库已连接 · 患者端网页版（数据来自 32 张真实表）':'本地演示数据（云端未连接）';cb&&cb();};
 try{
  var xhr=new XMLHttpRequest();xhr.open('GET',API,true);xhr.timeout=6000;
  xhr.onreadystatechange=function(){if(xhr.readyState===4){try{var d=JSON.parse(xhr.responseText);if(d.ok&&d.state){CLOUD=d.state;done(true);return;}}catch(e){}done(false);}};
  xhr.onerror=function(){done(false);};xhr.ontimeout=function(){done(false);};xhr.send();
 }catch(e){done(false);}
}
function go(p){PAGE=p;render();window.scrollTo(0,0);}
function render(){document.getElementById('phone').innerHTML=view();document.getElementById('tabbar').style.display=S.patientId?'flex':'none';
 [].forEach.call(document.querySelectorAll('#tabbar div'),function(d){d.className=d.getAttribute('data-p')===PAGE?'on':'';});}
function view(){if(!S.patientId)return loginView();
 var m={home:homeView,book:bookView,billing:billingView,member:memberView,records:recordsView};return (m[PAGE]||homeView)();}
function loginView(){return '<div class="login-page" style="padding-top:22px"><div class="login-brand"><div class="login-logo">齿</div><span class="login-title">云齿通 CloudDent</span><span class="login-sub">方寸口腔连锁门诊 · 患者端</span></div><div class="login-box"><input class="input" id="lg-phone" type="tel" placeholder="手机号" value="13800000001"><input class="input" id="lg-pwd" type="password" placeholder="密码" value="123456"><button class="btn btn-primary login-btn" onclick="doLogin()">登 录</button><p class="muted" style="text-align:center;margin:14px 0 0">演示账号 13800000001 ~ 003，密码 123456</p></div></div>';}
function doLogin(){var p=document.getElementById('lg-phone').value.trim(),w=document.getElementById('lg-pwd').value.trim();
 var a=ACCOUNTS.filter(function(x){return x.phone===p&&x.password===w;})[0];
 if(!a){toast('手机号或密码错误');return;}S=Object.assign({},a);PAGE='home';render();}
function logout(){S={};PAGE='login';render();}
function homeView(){var ap=mine('appointments'),bl=mine('bills'),mem=(SEED.members.filter(function(x){return x.patientId===S.patientId;})[0]||{});
 var pending=bl.filter(function(x){return x.status==='待支付';});
 var entries=[['约','在线预约','book'],['费','缴费收据','billing'],['员','会员中心','member'],['录','就诊记录','records']];
 return '<div class="page" style="padding-top:22px"><div class="hero"><span class="hero-title">你好，'+esc(S.name)+'</span><span class="hero-sub">'+esc(shopName(S.shopId))+' · '+esc(mem.level||'普通')+'</span></div>'+
 '<div class="card"><div class="grid-4">'+entries.map(function(e){return '<div class="entry" onclick="go(\''+e[2]+'\')"><div class="entry-icon">'+e[0]+'</div><span class="entry-text">'+e[1]+'</span></div>';}).join('')+'</div></div>'+
 (ap[0]?'<div class="card"><span class="card-title">下次预约</span><div class="list-item"><span class="item-title">'+esc(ap[0].date)+' '+esc(ap[0].time)+'</span><span class="tag">'+esc(ap[0].status)+'</span></div><span class="item-sub">'+esc(shopName(ap[0].shopId))+' · '+esc(ap[0].doctor)+' · '+esc(ap[0].item)+' · '+esc(ap[0].chair)+'</span></div>':'')+
 '<div class="card"><span class="card-title">待支付账单</span>'+pending.map(function(b){return '<div class="list-item"><span class="item-title">'+esc(b.item)+'</span><span class="tag tag-warn">¥'+b.amount+'</span></div>';}).join('')+(pending.length?'':'<div class="empty">暂无待支付账单</div>')+'</div>'+
 '<div class="card"><span class="card-title">门诊公告</span>'+SEED.notices.map(function(n){return '<div class="list-item"><span class="item-title">'+esc(n.text)+'</span><span class="tag">'+esc(n.tag)+'</span></div>';}).join('')+'</div>'+
 '<button class="btn btn-ghost" onclick="logout()">退出登录</button></div>';}
function bookView(){var shops=SEED.shops,sid=(FORM.sid||shops[0].id),dept=FORM.dept||'',docId=FORM.doc||'',svc=FORM.svc||'';
 var docs=SEED.doctors.filter(function(d){return d.shopId===sid&&(!dept||d.dept===dept);});
 var depts=[];SEED.doctors.filter(function(d){return d.shopId===sid;}).forEach(function(d){if(depts.indexOf(d.dept)<0)depts.push(d.dept);});
 var svcs=SEED.services.filter(function(x){return !dept||x.dept===dept;});var list=mine('appointments');
 var dates=['2026-11-27','2026-11-28','2026-11-29','2026-11-30'],times=['09:00-10:00','10:00-11:00','14:00-15:00','15:00-16:00'];

 sel('就诊门店','sid',shops.map(function(x){return [x.id,x.name];}),sid)+
 sel('就诊科室','dept',depts.map(function(x){return [x,x];}),dept)+
 sel('医生','doc',docs.map(function(x){return [x.id,x.name+' · '+x.dept];}),docId)+
 sel('诊疗项目','svc',svcs.map(function(x){return [x.id,x.name+' ¥'+x.price];}),svc)+
 sel('就诊日期','date',dates.map(function(x){return [x,x];}),FORM.date||dates[0])+

 '<div class="card"><span class="card-title">我的预约</span>'+list.map(function(a){return '<div class="list-item"><div style="flex:1"><span class="item-title">'+esc(a.date)+' '+esc(a.time)+'</span><span class="item-sub">'+esc(shopName(a.shopId))+' · '+esc(a.doctor)+' · '+esc(a.item)+'</span></div><div style="text-align:right"><span class="tag">'+esc(a.status)+'</span>'+(a.status==='已预约'||a.status==='待到诊'?'<button class="btn btn-sm btn-ghost" onclick="cancelBook(\''+esc(a.id)+'\')">取消</button>':'')+'</div></div>';}).join('')+(list.length?'':'<div class="empty">暂无预约记录</div>')+'</div></div>';}
function sel(label,key,opts,val){return '<span class="field-label">'+label+'</span><select class="picker" onchange="FORM.'+key+'=this.value;render()">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
function submitBook(){var sid=FORM.sid||SEED.shops[0].id,doc=SEED.doctors.filter(function(x){return x.id===(FORM.doc||'')&&x.shopId===sid;})[0],svc=SEED.services.filter(function(x){return x.id===(FORM.svc||'');})[0];
 if(!doc||!svc){toast('请完整选择预约信息');return;}
 var date=FORM.date||'2026-11-27',time=FORM.time||'09:00-10:00';
 if(!CLOUD||!CLOUD.appointments)CLOUD={};CLOUD.appointments=CLOUD.appointments||[];
 CLOUD.appointments.unshift({id:'AP'+Date.now(),patientId:S.patientId,name:S.name,shopId:sid,date:date,time:date+' '+time,doctorId:doc.id,item:svc.name,status:'已预约',chair:'待分配',source:'小程序'});
 toast('预约成功（演示：写入当前页面内存）');render();}
function cancelBook(id){var a=(CLOUD&&CLOUD.appointments||[]).filter(function(x){return x.id===id;})[0];if(a)a.status='已取消';
 var l=SEED.appointments.filter(function(x){return x.id===id;})[0];if(l)l.status='已取消';toast('预约已取消');render();}
function billingView(){var bl=mine('bills'),pending=bl.filter(function(x){return x.status==='待支付';}),paid=bl.filter(function(x){return x.status==='已支付';});
 return '<div class="page" style="padding-top:22px"><div class="card"><span class="card-title">待支付</span>'+pending.map(function(b){return '<div class="list-item"><div style="flex:1"><span class="item-title">'+esc(b.item)+'</span><span class="item-sub">'+esc(b.billNo)+' · '+esc(shopName(b.shopId))+' · '+esc(b.date)+'</span><button class="btn btn-sm btn-primary" onclick="pay(\''+esc(b.id)+'\',\'微信\')">微信支付</button><button class="btn btn-sm btn-ghost" onclick="pay(\''+esc(b.id)+'\',\'支付宝\')">支付宝</button></div><span class="tag tag-warn">¥'+b.amount+'</span></div>';}).join('')+(pending.length?'':'<div class="empty">暂无待支付账单</div>')+'</div>'+
 '<div class="card"><span class="card-title">缴费记录与电子收据</span>'+paid.map(function(b){return '<div class="list-item"><div style="flex:1"><span class="item-title">'+esc(b.item)+'</span><span class="item-sub">'+esc(b.method)+' · '+esc(shopName(b.shopId))+' · '+esc(b.date)+'</span><span class="item-sub">收据号 '+esc(b.receipt)+'</span></div><span class="tag">¥'+b.amount+'</span></div>';}).join('')+(paid.length?'':'<div class="empty">暂无缴费记录</div>')+'</div></div>';}
function pay(id,method){function hit(arr){var b=(arr||[]).filter(function(x){return x.id===id;})[0];if(b){b.status='已支付';b.method=method;b.receipt='RCP'+Date.now();}}
 hit(CLOUD&&CLOUD.bills);hit(SEED.bills);toast('支付成功，收据已生成（演示）');render();}
function memberView(){var mem=SEED.members.filter(function(x){return x.patientId===S.patientId;})[0]||{},fbs=mine('feedbacks');
 return '<div class="page" style="padding-top:22px"><div class="card"><span class="card-title">会员账户</span><div class="grid" style="text-align:center"><div style="width:33.33%"><span class="stat-num">¥'+(mem.balance||0)+'</span><span class="stat-label">储值余额</span></div><div style="width:33.33%"><span class="stat-num">'+(mem.points||0)+'</span><span class="stat-label">可用积分</span></div><div style="width:33.33%"><span class="stat-num" style="font-size:15px">'+esc(mem.level||'普通')+'</span><span class="stat-label">会员等级</span></div></div><div class="divider"></div><div class="kv"><span class="kv-label">会员卡号</span><span>'+esc(mem.cardNo||'—')+'</span></div><div class="kv"><span class="kv-label">所属门店</span><span>'+esc(shopName(S.shopId))+'</span></div></div>'+
 '<div class="card"><span class="card-title">就诊反馈</span><textarea class="textarea" id="fb-content" placeholder="请填写您的就诊体验或建议"></textarea><button class="btn btn-primary" style="margin-top:12px" onclick="submitFb()">提交反馈</button></div>'+
 '<div class="card"><span class="card-title">我的反馈</span>'+fbs.map(function(f){return '<div class="list-item"><div style="flex:1"><span class="item-title">'+esc(f.content)+'</span><span class="item-sub">'+esc(f.date)+' · '+esc(f.reply||'待回复')+'</span></div></div>';}).join('')+(fbs.length?'':'<div class="empty">暂无反馈记录</div>')+'</div></div>';}
function submitFb(){var el=document.getElementById('fb-content'),c=(el.value||'').trim();if(!c){toast('请填写反馈内容');return;}
 if(!CLOUD||!CLOUD.feedbacks)CLOUD=CLOUD||{},CLOUD.feedbacks=[];
 CLOUD.feedbacks.unshift({id:'FB'+Date.now(),patientId:S.patientId,date:new Date().toISOString().slice(0,10),content:c,reply:''});toast('反馈已提交（演示）');render();}

 return '<div class="page" style="padding-top:22px">'+rs.map(function(r){return '<div class="card"><div class="list-item"><span class="item-title">'+esc(r.date)+' · '+esc(shopName(r.shopId))+'</span><span class="tag">牙位 '+esc(r.tooth)+'</span></div><div class="kv"><span class="kv-label">主诊医生</span><span>'+esc(r.doctor||DOC[r.doctorId]||'')+'</span></div><div class="kv"><span class="kv-label">主诉</span><span>'+esc(r.chief)+'</span></div><div class="kv"><span class="kv-label">诊断</span><span>'+esc(r.diagnosis)+'</span></div><div class="kv"><span class="kv-label">处置</span><span>'+esc(r.treatment)+'</span></div><div class="kv"><span class="kv-label">影像资料</span><span>'+esc(r.imaging)+'</span></div></div>';}).join('')+(rs.length?'':'<div class="empty">暂无就诊记录</div>')+'</div>';}
[].forEach.call(document.querySelectorAll('#tabbar div'),function(d){d.onclick=function(){go(d.getAttribute('data-p'));};});
render();loadCloud(function(){render();});
